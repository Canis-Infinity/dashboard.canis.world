services:
  dashboard:
    image: node:24-alpine
    container_name: dashboard_canis_world
    working_dir: /app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 7343
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://host.docker.internal:7344}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - dashboard-node-modules:/app/node_modules
      - dashboard-next:/app/.next
    command: sh -c "npm ci --legacy-peer-deps --include=dev && npm run build && rm -rf .next/standalone/public .next/standalone/.next/static && mkdir -p .next/standalone/.next && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static && node .next/standalone/server.js"
    ports:
      - "7343:7343"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7343/login >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  dashboard-node-modules:
  dashboard-next:
